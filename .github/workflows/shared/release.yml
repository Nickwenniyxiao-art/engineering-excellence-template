name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release@24 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/github@10 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14

      - name: Pre-check existing tags
        run: |
          git fetch --tags
          echo "Existing tags (v*):"
          git tag -l 'v*' | sort -V || true
          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -n1)
          echo "Latest tag: ${LATEST_TAG:-<none>}"

      - name: Temporarily allow direct push
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          gh api repos/${{ github.repository }}/branches/main/protection/enforce_admins -X DELETE || true

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          git fetch --tags --force
          npx semantic-release

      - name: Re-enable branch protection
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          gh api repos/${{ github.repository }}/branches/main/protection/enforce_admins -X POST || true
