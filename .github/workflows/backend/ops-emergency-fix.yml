name: "🚨 Ops — Emergency VPS Fix"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "执行动作"
        required: true
        type: choice
        options:
          - rollback-test
          - restart-medusa
          - restart-postgres
          - restart-redis
          - clean-disk
          - collect-logs
        default: rollback-test

permissions:
  contents: read

jobs:
  emergency-fix:
    name: Emergency fix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH emergency action
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            ACTION="${{ github.event.inputs.action }}"

            echo "Action: $ACTION"

            case "$ACTION" in
              rollback-test)
                docker restart <PROJECT>_medusa_test || true
                ;;
              restart-medusa)
                docker restart <PROJECT>_medusa || true
                ;;
              restart-postgres)
                docker restart <PROJECT>_postgres || true
                ;;
              restart-redis)
                docker restart <PROJECT>_redis || true
                ;;
              clean-disk)
                docker system prune -af || true
                ;;
              collect-logs)
                docker logs <PROJECT>_medusa --tail 200 || true
                docker logs <PROJECT>_postgres --tail 200 || true
                docker logs <PROJECT>_redis --tail 200 || true
                ;;
              *)
                echo "Unknown action: $ACTION"
                exit 1
                ;;
            esac

            echo "=== health snapshot ==="
            for P in 9000 9001 9002; do
              S=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:$P/health 2>/dev/null || echo "000")
              echo "Port $P => HTTP $S"
            done
