name: DORA Metrics

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Collect and publish DORA metrics
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date();
            const sevenDaysAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);
            const thirtyDaysAgo = new Date(now - 30 * 24 * 60 * 60 * 1000);

            const commits7d = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: 'main',
              since: sevenDaysAgo.toISOString(),
              per_page: 100
            });
            const commits30d = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: 'main',
              since: thirtyDaysAgo.toISOString(),
              per_page: 100
            });

            const mergedPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 100
            });

            const recentMerged = mergedPRs.data.filter(pr => pr.merged_at && new Date(pr.merged_at) > thirtyDaysAgo);
            const leadTimes = recentMerged.map(pr => (new Date(pr.merged_at) - new Date(pr.created_at)) / (1000 * 60 * 60));
            const avgLeadTimeHours = leadTimes.length ? (leadTimes.reduce((a, b) => a + b, 0) / leadTimes.length) : 0;

            const hotfixIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'type: hotfix',
              state: 'all',
              since: thirtyDaysAgo.toISOString(),
              per_page: 100
            });

            const incidents = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'type: incident',
              state: 'closed',
              since: thirtyDaysAgo.toISOString(),
              per_page: 100
            });

            const restoreTimes = incidents.data
              .filter(i => i.closed_at)
              .map(i => (new Date(i.closed_at) - new Date(i.created_at)) / (1000 * 60 * 60));

            const deployFreq7d = commits7d.data.length;
            const deployFreq30d = commits30d.data.length;
            const deployFreqDaily = deployFreq30d / 30;
            const cfr = recentMerged.length ? (hotfixIssues.data.length / recentMerged.length) * 100 : 0;
            const avgRestoreHours = restoreTimes.length ? (restoreTimes.reduce((a, b) => a + b, 0) / restoreTimes.length) : 0;

            const qualityTrend = [
              `- Weekly deploys: ${deployFreq7d}`,
              `- 30-day deploys: ${deployFreq30d}`,
              `- Avg lead time: ${avgLeadTimeHours.toFixed(1)}h`,
              `- Change failure rate: ${cfr.toFixed(1)}%`,
              `- MTTR: ${restoreTimes.length ? avgRestoreHours.toFixed(1) + 'h' : 'No incidents'}`
            ].join('\n');

            const report = `# DORA Metrics Report\n\n| Metric | Value | Period |\n|---|---|---|\n| Deployment Frequency | ${deployFreq7d}/week (${deployFreqDaily.toFixed(1)}/day) | 7d/30d |\n| Lead Time for Changes | ${recentMerged.length ? avgLeadTimeHours.toFixed(1) + 'h' : 'N/A'} | 30d |\n| Change Failure Rate | ${cfr.toFixed(1)}% | 30d |\n| MTTR | ${restoreTimes.length ? avgRestoreHours.toFixed(1) + 'h' : 'No incidents'} | 30d |\n\n## Quality Trend\n${qualityTrend}\n\nGenerated at: ${now.toISOString()}`;

            core.summary.addRaw(report);
            await core.summary.write();

            const issueTitle = `DORA Weekly Report - ${now.toISOString().slice(0, 10)}`;
            const body = `${report}\n\n> Auto-generated by workflow: dora-metrics.yml`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body,
              labels: ['metrics', 'dora']
            });
