name: "🔧 Ops — Redis 诊断与修复"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "执行动作"
        required: true
        type: choice
        options:
          - diagnose-only
          - restart-redis
          - full-recovery
        default: diagnose-only

permissions:
  contents: read

jobs:
  redis-fix:
    runs-on: ubuntu-latest
    steps:
      - name: SSH redis operation
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            ACTION="${{ github.event.inputs.action }}"

            echo "=== Redis diagnose ==="
            docker ps -a --filter "name=redis" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            if [ "$ACTION" = "restart-redis" ] || [ "$ACTION" = "full-recovery" ]; then
              docker restart <PROJECT>_redis || true
              sleep 5
              docker exec <PROJECT>_redis redis-cli ping || true
            fi

            if [ "$ACTION" = "full-recovery" ]; then
              docker restart <PROJECT>_medusa || true
              docker restart <PROJECT>_medusa_test || true
              docker restart <PROJECT>_medusa_staging || true
              sleep 20
            fi

            echo "=== Health checks ==="
            for P in 9000 9001 9002; do
              S=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:$P/health 2>/dev/null || echo "000")
              echo "Port $P => HTTP $S"
            done
